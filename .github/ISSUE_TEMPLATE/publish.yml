name: Publish a plugin
description: Submit a new plugin or a new version at an exact commit.
title: "Publish: "
labels: [publish]
body:
  - type: markdown
    attributes:
      value: |
        Anyone can submit a public repository. Automated analysis is followed by human review of the exact commit.
  - type: textarea
    id: release
    attributes:
      label: Release
      description: Replace these values. The optional path selects a plugin subdirectory.
      render: json
      value: |
        {"repository":"https://github.com/owner/repository","path":""}
    validations:
      required: true
