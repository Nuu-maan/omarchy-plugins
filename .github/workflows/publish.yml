name: Publish registry
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          PROCESS_SUBMISSIONS: 'true'
      - run: BASE_PATH=/ python scripts/build.py
      - name: Request catalogue deployment
        env:
          DEPLOY_HOOK: ${{ secrets.REGISTRY_DEPLOY_HOOK }}
        run: python scripts/deploy.py
